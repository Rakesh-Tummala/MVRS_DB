[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvrs_db"
version = "0.1.0"
description = "An educational relational database engine written from scratch in Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]
cli = ["typer>=0.12"]
bench = ["matplotlib>=3.8"]
vector = ["numpy>=2"]

[project.scripts]
mvrs_db = "mvrs_db.cli:app"

[tool.setuptools.packages.find]
include = ["mvrs_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep test files off C:. The .tmp folder must exist before pytest starts.
addopts = "-ra --strict-markers --basetemp=.tmp/pytest"
markers = [
    "crash: kills a real child process (slow)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
# The keyword lists read better as whitespace-separated words than as list literals.
"mvrs_db/sql/lexer.py" = ["SIM905"]
# typer declares arguments as call expressions in defaults; that is its API.
"mvrs_db/cli.py" = ["B008"]
# The scripts import their sibling module after adjusting sys.path, and their
# lambdas inside loops are called at once, before the loop variable changes.
"benchmarks/*.py" = ["I001", "B023", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
